name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Refresh the GitHub avatar (and rebuild the site) once a week,
  # so the sidebar avatar follows your GitHub profile automatically.
  schedule:
    - cron: "0 3 * * 0"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Sync GitHub avatar
        # Pull the current avatar of the repo owner into the site build.
        # Local (same-origin) file => no external CDN dependency at runtime.
        run: |
          mkdir -p assets/avatar
          if curl -fsSL --retry 3 --retry-delay 2 \
               -o /tmp/gh-avatar.png \
               "https://github.com/${GITHUB_REPOSITORY_OWNER}.png?size=460"; then
            mv /tmp/gh-avatar.png assets/avatar/avatar.png
            file assets/avatar/avatar.png
            ls -l assets/avatar/avatar.png
          else
            echo "avatar sync failed - keeping the copy committed in the repository"
          fi

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
